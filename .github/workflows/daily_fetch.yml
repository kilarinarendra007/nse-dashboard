name: Daily NSE data fetch

on:
  schedule:
    # 13:00 UTC = 18:30 IST, Mon-Fri. NSE bhavcopy is usually published
    # by early evening IST, well before this runs.
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backfill start date (YYYY-MM-DD). Leave blank for just today."
        required: false
      end_date:
        description: "Backfill end date (YYYY-MM-DD). Leave blank for just today."
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's data
        if: ${{ github.event.inputs.start_date == '' && github.event.inputs.end_date == '' }}
        run: python fetch_data.py

      - name: Backfill date range
        if: ${{ github.event.inputs.start_date != '' && github.event.inputs.end_date != '' }}
        run: python fetch_data.py --start "${{ github.event.inputs.start_date }}" --end "${{ github.event.inputs.end_date }}"

      - name: Commit and push updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nse_data.db
          git diff --staged --quiet || git commit -m "Update NSE data $(date -u +'%Y-%m-%d')"
          git push
